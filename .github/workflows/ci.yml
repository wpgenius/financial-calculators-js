name: CI

# Checks every pull request (and pushes to main): ESLint, the unit tests on
# each supported Node version, that the three build files are produced and
# work, their size budget, the TypeScript types, what the npm package would
# contain, browser tests (Playwright) of the build files and the website
# demos, and that PRs leave dist/ and CHANGELOG.md to the release workflow.
#
# The last job, "CI", passes only when every other job passed. It is the one
# check the "Protect main" ruleset requires, so jobs can be added or renamed
# here without touching the ruleset.

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint

  test:
    name: Tests (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22', '24']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Check the build files and the browser global
        run: npm run test:dist
      - name: Check the size budget
        run: npm run size

      - name: Check the TypeScript types
        run: npm run test:types

      - name: Check what the npm package would contain
        run: npm pack --dry-run

      # dist/ and CHANGELOG.md are written by the release workflow only. If a
      # PR changes them too, every release makes the open PRs conflict.
      - name: PR leaves dist/ and CHANGELOG.md to the release workflow
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          changed="$(git diff --name-only --diff-filter=MD "$BASE"...HEAD -- dist CHANGELOG.md)"
          added_dist="$(git diff --name-only --diff-filter=A "$BASE"...HEAD -- dist)"
          if [ -n "$changed$added_dist" ]; then
            echo "::error::Please don't commit these files; the release workflow writes them when your PR is merged:"
            printf '%s\n' $changed $added_dist
            echo "Undo with: git checkout origin/main -- dist CHANGELOG.md (or git rm the new files)"
            exit 1
          fi

  browser:
    name: Browser tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Build the library and the website
        run: |
          npm run build
          npm run site
      - run: npm run test:e2e
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7

  ci:
    name: CI
    if: always()
    needs: [lint, test, build, browser]
    runs-on: ubuntu-latest
    steps:
      - name: All jobs passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: $RESULTS"
          for result in $RESULTS; do
            if [ "$result" != "success" ]; then
              echo "::error::A CI job did not pass ($result)."
              exit 1
            fi
          done
