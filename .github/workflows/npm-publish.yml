name: Publish to npm

# Publishes an existing release to npm by hand: for a release whose npm step
# failed. New releases are published by the release workflow on their own.
# Needs a tag made by the release workflow (it holds the built dist/ files).

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish (such as v1.1.0)
        required: true
        type: string

permissions:
  contents: read
  id-token: write # npm trusted publishing and provenance.

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest
    steps:
      - name: Check the tag
        env:
          TAG: ${{ inputs.tag }}
        run: |
          if ! printf '%s' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::'$TAG' is not a release tag such as v1.1.0."
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.tag }}

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org

      - name: Publish
        env:
          TAG: ${{ inputs.tag }}
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v$version" != "$TAG" ]; then
            echo "::error::package.json at $TAG says $version."
            exit 1
          fi
          if [ ! -f dist/financial-calculators.esm.js ]; then
            echo "::error::$TAG has no dist/ files; only tags made by the release workflow can be published."
            exit 1
          fi
          npm install -g npm@11 --ignore-scripts
          npm publish --provenance --access public --ignore-scripts
