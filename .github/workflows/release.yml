name: Release

# On each push to main: if src/ changed since the last release tag, build the
# library and publish a GitHub release with the three build files.
#
# - Version: from the tags (vX.Y.Z), never from a file. The first release is
#   1.0.0. After that a patch bump, or minor/major when the merged PR has the
#   label release:minor or release:major.
# - Changelog: one line per issue the merged pull requests closed.
# - Nothing is committed back to main: the version is stamped into the build.
# - Docs, tests, CI and config changes (nothing under src/) make no release.

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read
  issues: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Plan the release
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/release-plan.sh

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.plan.outputs.release == 'true'
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Build and test
        if: steps.plan.outputs.release == 'true'
        env:
          RELEASE_VERSION: ${{ steps.plan.outputs.version }}
        run: |
          npm ci
          npm test
          npm run build
          npm run test:dist

      - name: Publish the release
        if: steps.plan.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.plan.outputs.version }}
        run: |
          gh release create "v$VERSION" \
            --target "$GITHUB_SHA" \
            --title "v$VERSION" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            dist/financial-calculators.js \
            dist/financial-calculators.min.js \
            dist/financial-calculators.esm.js
