name: Release

# A change to the library code (src/) on main makes a release: the version in
# package.json is bumped, dist/ rebuilt and tested, CHANGELOG.md updated, and a
# "Release vX.Y.Z" commit and its tag are pushed to main. Then a GitHub release
# is published with the three build files, and the package is published to npm
# through npm trusted publishing (no token).
#
# Patch by default; label the merged PR release:minor or release:major for a
# bigger bump (the Foldbox spelling "release: minor" works too).

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump
        type: choice
        options: [patch, minor, major]
        default: patch

permissions:
  contents: write
  pull-requests: read
  issues: read
  id-token: write # npm trusted publishing and provenance.

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    if: "!startsWith(github.event.head_commit.message, 'Release v')"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # Pushes the release commit and tag with the "release-bot" deploy key,
          # which the "Protect main" ruleset lets bypass the pull request rule.
          ssh-key: ${{ secrets.RELEASE_DEPLOY_KEY }}

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          registry-url: https://registry.npmjs.org

      # Install scripts aren't needed, and this job can write to the repo.
      - run: npm ci --ignore-scripts

      # A run can wait in the queue while an earlier one releases, so release
      # from the latest main; if its tip is already a release, the earlier run
      # included this change.
      - name: Sync with the latest main
        id: sync
        run: |
          git fetch origin main
          git checkout -B main origin/main
          if git log -1 --format=%s | grep -q '^Release v'; then
            echo "Latest main is already a release; nothing to do."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Choose the version bump
        id: bump
        if: steps.sync.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_BUMP: ${{ inputs.bump }}
        run: |
          bump="${INPUT_BUMP:-patch}"
          if [ "${{ github.event_name }}" = "push" ]; then
            labels="$(gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/pulls" --jq '[.[0].labels[]?.name] | join(",")' || true)"
            case ",$labels," in
              *",release:major,"*|*",release: major,"*) bump=major ;;
              *",release:minor,"*|*",release: minor,"*) bump=minor ;;
            esac
          fi
          echo "bump=$bump" >> "$GITHUB_OUTPUT"

      - name: Bump the version and update the changelog
        id: release
        if: steps.sync.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/release.sh "${{ steps.bump.outputs.bump }}"

      - name: Build and test
        if: steps.sync.outputs.skip != 'true'
        run: |
          npm test
          npm run build
          npm run test:dist

      - name: Commit, tag and push
        if: steps.sync.outputs.skip != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json dist CHANGELOG.md
          git commit -m "Release ${{ steps.release.outputs.tag }}"
          git tag "${{ steps.release.outputs.tag }}"
          # Atomic: the branch and the tag land together or not at all.
          git push --atomic origin HEAD:main "${{ steps.release.outputs.tag }}"

      - name: Publish the GitHub release
        if: steps.sync.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="${{ steps.release.outputs.notes_file }}"
          printf '\n**Download:** `financial-calculators.min.js` for a `<script>` tag (global `FinancialCalculators`), `financial-calculators.esm.js` for `import`, or the readable `financial-calculators.js`. Also on npm: `npm install @wpgenius/financial-calculators`.\n' >> "$notes"
          gh release create "${{ steps.release.outputs.tag }}" \
            --title "${{ steps.release.outputs.tag }}" \
            --notes-file "$notes" \
            dist/financial-calculators.js \
            dist/financial-calculators.min.js \
            dist/financial-calculators.esm.js

      # Last, so a failing npm publish never blocks the GitHub release (retry
      # with the "Publish to npm" workflow). Trusted publishing needs npm
      # 11.5.1 or later, newer than the one Node 22 ships with.
      - name: Publish to npm
        if: steps.sync.outputs.skip != 'true'
        run: |
          npm install -g npm@11 --ignore-scripts
          npm publish --provenance --access public --ignore-scripts
