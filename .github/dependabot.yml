version: 2
updates:
  # Keeps the SHA-pinned actions in .github/workflows up to date.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: ci
    labels:
      - dependencies

  # Dev tools from package.json (esbuild, ESLint), one grouped PR a month.
  # They don't change src/, so they make no release.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    groups:
      npm:
        patterns: ['*']
    commit-message:
      prefix: build
    labels:
      - dependencies
